<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glass glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Icon glyph with drop shadow -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Cashbook receipt silhouette -->
    <path 
      d="M50 30 C50 18 60 8 72 8 L228 8 C240 8 250 18 250 30 L250 310 L220 295 L190 310 L160 295 L130 310 L100 295 L70 310 L50 295 Z" 
      fill="white" 
      opacity="0.95"
    />
    
    <!-- Accent line details -->
    <rect x="85" y="70" width="130" height="18" rx="9" fill="#0f766e"/>
    <rect x="85" y="115" width="130" height="18" rx="9" fill="#0f766e"/>
    <rect x="85" y="160" width="85" height="18" rx="9" fill="#0f766e"/>

    <!-- Green check circle badge -->
    <circle cx="215" cy="235" r="42" fill="#10b981"/>
    <path d="M198 235 L209 246 L233 222" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
